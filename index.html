<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmiki AI Master</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo-title">
                <h1>वाल्मीकि AI मास्टर</h1>
                <span class="subtitle">विज़न और वॉइस मॉडल द्वारा संचालित</span>
            </div>
            <div class="user-brand">
                <span>कंडेरा</span>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container" id="chatContainer">
            <div class="welcome-card" id="welcomeCard">
                <i class="fa-solid fa-wand-magic-sparkles welcome-icon"></i>
                <h2>नमस्ते! मैं वाल्मीकि AI मास्टर हूँ।</h2>
                <p>आप मुझसे कुछ भी पूछ सकते हैं, फोटो एडिट करवा सकते हैं या फोटो अपलोड करके सवाल पूछ सकते हैं।</p>
            </div>
        </main>

        <!-- Audio Output Controls (Floating Player when AI is speaking) -->
        <div class="audio-control-bar hidden" id="audioControlBar">
            <div class="audio-info">
                <i class="fa-solid fa-volume-high animated-speaker"></i>
                <span id="audioStatus">AI जवाब बोल रहा है...</span>
            </div>
            <div class="audio-buttons">
                <button id="pauseAudioBtn" title="रोकें / चलाएं"><i class="fa-solid fa-pause"></i></button>
                <button id="stopAudioBtn" title="बंद करें"><i class="fa-solid fa-square"></i></button>
            </div>
        </div>

        <!-- Image Preview Container -->
        <div class="image-preview-bar hidden" id="imagePreviewBar">
            <div class="preview-wrapper">
                <img id="imagePreview" src="" alt="Preview">
                <button id="removeImageBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <span class="preview-text">फोटो संलग्न की गई है</span>
        </div>

        <!-- Input Section -->
        <footer class="input-container">
            <div class="input-box">
                <!-- Camera / Attachment Button -->
                <label for="imageInput" class="icon-btn" title="फोटो अपलोड करें या फोटो खींचें">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="imageInput" accept="image/*" capture="environment" style="display: none;">

                <!-- Textarea for prompt -->
                <textarea id="userInput" placeholder="सवाल लिखें या फोटो अपलोड करके निर्देश दें..." rows="1"></textarea>

                <!-- Mic Recording Button -->
                <button id="micBtn" class="icon-btn mic-btn" title="बोलकर संदेश भेजें">
                    <i class="fa-solid fa-microphone" id="micIcon"></i>
                </button>

                <!-- Send Button -->
                <button id="sendBtn" class="icon-btn send-btn" title="भेजें">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
